<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>視聴記録 拡張機能設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>視聴記録 拡張機能設定</h1>
    <form id="settingsForm">
      <label for="url">視聴記録のURL:</label>
      <input
        type="url"
        id="url"
        placeholder="視聴記録のURLを入力してください"
      />
      <label for="showReviewButton">エピソードのレビューボタンを表示する</label>
      <input type="checkbox" name="showReviewButton" id="showReviewButton" />
      <label for="showReviewDialog"
        >エピソード視聴終了後にレビューダイアログを表示する</label
      >
      <input type="checkbox" name="showReviewDialog" id="showReviewDialog" />
      <button type="submit" id="save">保存する</button>
    </form>
    <hr />
    <h2>検索対象URLの追加</h2>
    <form>
      <label for="urlInput">検索対象のURL:</label>
      <input type="url" name="urlInput" id="urlInput" />
      <button type="submit" id="addUrlButton">追加</button>
    </form>
    <h2>検索対象URL</h2>
    <p>
      削除は拡張機能を管理 (<code>chrome://extensions</code>)
      から行ってください。
    </p>
    <ul id="urlList"></ul>
    <script src="validator.js"></script>
    <script src="options.js"></script>
  </body>
</html>
